name: Source quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifests, Python, XML and secret patterns
        run: python scripts/validate_source.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find custom_addons -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check whitespace errors
        run: git diff --check HEAD
